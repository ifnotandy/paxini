<svg width="680" height="196" viewBox="0 0 680 196" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>手套帧的时间戳来自 SDK</title>
  <desc>SDK 在完整帧装配完成时同时给出墙钟与单调钟两个读数，之后回调、入队、写盘都不再产生新时间戳。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="196" fill="#F7F6F3"/>

  <line x1="60" y1="132" x2="620" y2="132" stroke="#888780" stroke-width="1" marker-end="url(#ar)"/>
  <text x="612" y="122" text-anchor="end" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#888780">主机时间</text>

  <line x1="200" y1="46" x2="200" y2="127" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>
  <circle cx="200" cy="132" r="5" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="214" y="42" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#444441">SDK 拼装完成这一帧，同时打两个</text>
  <rect x="214" y="52" width="204" height="22" rx="4" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="224" y="67" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#185FA5">timestamp_unix_ns（墙钟）</text>
  <rect x="214" y="80" width="204" height="22" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="224" y="95" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#0F6E56">timestamp_monotonic_ns</text>
  <text x="214" y="118" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#888780">同一瞬间，两个钟面读数</text>

  <circle cx="470" cy="132" r="5" fill="#B4B2A9" stroke="#888780" stroke-width="0.5"/>
  <line x1="470" y1="88" x2="470" y2="127" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>
  <text x="484" y="84" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#444441">回调 → 入队 → 写盘</text>
  <text x="484" y="104" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#888780">这段不再产生时间戳</text>

  <text x="60" y="168" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5F5E5A">帧间隔、实际频率用单调钟算；与视频对表只能用墙钟</text>
</svg>
